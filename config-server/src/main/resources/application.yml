server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Par défaut "native" charge directement config-repo/ (fonctionne sur toute machine vierge).
    # Pour utiliser un dépôt Git distant (GitHub), passer CONFIG_MODE=git et CONFIG_GIT_URI=https://github.com/<user>/driveeasy-backend
    active: ${CONFIG_MODE:native}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file:./}
          default-label: ${CONFIG_GIT_BRANCH:main}
          search-paths: config-repo,../config-repo
          clone-on-start: true
          timeout: 10
        native:
          search-locations: file:./config-repo/,file:../config-repo/

eureka:
  client:
    registry-fetch-interval-seconds: 3
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
